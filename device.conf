# The realme X2 (RMX1992, 8 GB). Its SoC layer is xnu_kernel_qcom_common.
device x2
	title	realme X2 (x2)
	vendor	realme
	soc	sm7150
	soc_vendor	qcom
	machine	SWEET
	boot	abl
	gpu	none
	bootimg_version	2
	bootimg_pagesize	4096
	bootimg_base	0
	bootimg_kernel_offset	0x8000
	bootimg_ramdisk_offset	0x1000000
	bootimg_tags_offset	0x100
	bootimg_dtb_offset	0x1f00000
	bootimg_os_version	14.0.0
	bootimg_os_patch_level	2024-02
	bootimg_kernel	raw
	bootimg_cmdline	console=null
	defconfig	x2_defconfig
	cmdline	cpus=6 unentitled_ios_sim_launch=1 ignition_level=1 ufsrw=1 rootrw=1 launchd_unsecure_cache=1 sweetx2=1 sweetlog=1
	adt	--ufs
	root_size	16g
	status	wip
